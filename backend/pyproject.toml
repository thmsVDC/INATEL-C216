[project]
name = "organizaja-api"
version = "0.1.0"
description = "API para gestão de eventos acadêmicos, inscrições de participantes e controle de vagas."
authors = [
    { name = "Thomas Victor Dias Carvalho", email = "thomasvictordias@outlook.com" },
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "sqlalchemy (>=2.1.5,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.16.4,<0.17.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
