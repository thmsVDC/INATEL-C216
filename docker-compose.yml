services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: c216-frontend
    ports:
      - "5173:80"
    networks:
      - c216-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: c216-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres@db:5432/c216db}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - c216-network

  db:
    image: postgres:16-alpine
    container_name: c216-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=c216db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d c216db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - c216-network

volumes:
  postgres_data:

networks:
  c216-network:
    driver: bridge
